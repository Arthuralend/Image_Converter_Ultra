name: Build macOS app
on:
  push:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install encoders
        run: brew install jpeg-xl pngquant gifsicle dylibbundler
      - name: Build app
        run: ./scripts/build_app.sh
      - name: Package (zip + dmg)
        run: |
          ditto -c -k --keepParent "build/Image Converter Ultra.app" ImageConverterUltra.zip
          mkdir dmg && cp -R "build/Image Converter Ultra.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Image Converter Ultra" -srcfolder dmg -ov -format UDZO ImageConverterUltra.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ImageConverterUltra
          path: |
            ImageConverterUltra.dmg
            ImageConverterUltra.zip
      - name: Attach to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" ImageConverterUltra.dmg ImageConverterUltra.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
